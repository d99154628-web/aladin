<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알라딘과 12개의 사막 관문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --night-1:#150C33; --night-2:#241852; --night-3:#3B2570;
    --sand-1:#E8B54B; --sand-2:#C98A3A; --sand-3:#8B5A28;
    --magic:#8B5CF6; --treasure:#F4C430; --treasure-dark:#C89412;
    --cream:#FFF7E6; --ink:#2A1810; --danger:#E8636B; --success:#48D68C;
    --r-lg:22px; --r-md:14px; --r-sm:9px;
    --font-display:'Jua','Do Hyeon',sans-serif;
    --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --night-1:#150C33; --sand-1:#E8B54B; --cream:#FFF7E6; }
  }
  :root[data-theme="dark"]{ --night-1:#150C33; --sand-1:#E8B54B; --cream:#FFF7E6; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(to bottom, var(--night-1) 0%, var(--night-2) 45%, #4A3A6B 62%, var(--sand-2) 78%, var(--sand-1) 100%);
    color:var(--cream);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  .star{position:fixed;background:#fff;border-radius:50%;opacity:.8;pointer-events:none;}
  .moon{
    position:fixed; top:5%; right:8%; width:50px;height:50px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #FFF7DA, var(--treasure) 70%);
    box-shadow:0 0 26px rgba(244,196,48,.5); pointer-events:none;
  }

  #app{max-width:800px;margin:0 auto;padding:16px 16px 26px;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}

  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  header h1{font-family:var(--font-display);font-size:clamp(18px,2.8vw,24px);margin:0;color:var(--treasure);text-shadow:0 2px 0 rgba(0,0,0,.25);}
  .pill-btn{
    background:rgba(255,255,255,.08); color:var(--cream); border:1px solid rgba(255,255,255,.25);
    border-radius:999px; padding:8px 15px; font-family:var(--font-body); font-size:13.5px; cursor:pointer; white-space:nowrap;
  }
  .pill-btn:hover{background:rgba(255,255,255,.16);}

  /* progress row */
  #progress{display:flex;gap:5px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .prog-dot{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:14px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);opacity:.45;
  }
  .prog-dot.active{opacity:1;border-color:var(--treasure);box-shadow:0 0 8px rgba(244,196,48,.6);}
  .prog-dot.done{opacity:1;border-color:var(--success);background:rgba(72,214,140,.18);}

  /* stage */
  #stageWrap{flex:1;display:flex;align-items:center;justify-content:center;}
  #stage{
    width:100%;background:linear-gradient(180deg,var(--night-2),var(--night-1));
    border:1px solid rgba(255,255,255,.12); border-top:5px solid var(--treasure);
    border-radius:var(--r-lg); padding:32px 28px 26px; box-shadow:0 20px 60px rgba(0,0,0,.45);
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion: reduce){ #stage{animation:none;} }

  #stage .bigEmoji{font-size:52px;text-align:center;margin-bottom:8px;}
  .stage-image-box{
    width:100%;max-width:680px;margin:0 auto 18px;border-radius:18px;overflow:hidden;
    border:3px solid rgba(244,196,48,.72);background:#120A2C;
    box-shadow:0 12px 30px rgba(0,0,0,.38),0 0 22px rgba(244,196,48,.14);
  }
  .stage-image{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;}
  .stage-image-fallback{display:none;text-align:center;padding:30px 12px;color:#D8CFF8;font-size:14px;}
  #stage h2{font-family:var(--font-display);text-align:center;color:var(--treasure);margin:0 0 14px;font-size:clamp(22px,3.6vw,29px);}
  #stage .story{font-size:18px;line-height:1.75;background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:18px 20px;margin-bottom:16px;}
  .tag-pill{
    display:inline-block;background:var(--sand-1);color:var(--ink);font-size:14px;font-weight:700;
    padding:6px 14px;border-radius:999px;
  }
  .center{text-align:center;}

  /* choice list */
  .choice-list{display:flex;flex-direction:column;gap:11px;margin:18px 0 6px;}
  .choice-item{
    display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.06);
    border-radius:var(--r-md);padding:13px 18px;font-size:18px;line-height:1.4;
    border:2px solid transparent;transition:all .3s ease;
  }
  .choice-item .num{
    width:32px;height:32px;border-radius:50%;background:var(--sand-1);color:var(--ink);
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-size:17px;flex-shrink:0;
  }
  .choice-item.correct{background:rgba(72,214,140,.22);border-color:var(--success);}
  .choice-item.correct .num{background:var(--success);color:#06381f;}
  .choice-item.faded{opacity:.5;}

  .answer-box{
    background:rgba(72,214,140,.14);border:1px dashed var(--success);border-radius:var(--r-md);
    padding:14px 18px;margin:14px 0 4px;font-size:16.5px;line-height:1.6;
  }
  .btn{font-family:var(--font-body);font-size:16.5px;border:none;border-radius:999px;padding:13px 24px;cursor:pointer;font-weight:700;}
  .btn-primary{background:var(--treasure);color:#3a2a05;}
  .btn-primary:hover{background:#ffd66b;}
  .btn-ghost{background:transparent;color:var(--cream);border:1px solid rgba(255,255,255,.3);}
  .btn-ghost:hover{background:rgba(255,255,255,.08);}
  .stage-btn-row{display:flex;justify-content:center;margin-top:20px;}

  .intro-list{background:rgba(255,255,255,.06);border-radius:var(--r-md);padding:18px 22px;margin:16px 0;}
  .intro-list li{margin-bottom:10px;font-size:16.5px;line-height:1.6;}
  .intro-list li:last-child{margin-bottom:0;}

  /* lamps */
  .lamp-instruction{text-align:center;font-size:17px;margin-bottom:6px;}
  .lamp-row{display:flex;justify-content:center;gap:20px;margin:24px 0 6px;flex-wrap:wrap;}
  .lamp-btn{
    width:110px;background:transparent;border:none;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:8px;position:relative;padding:10px 0;
  }
  .lamp-art{width:88px;height:68px;filter:drop-shadow(0 7px 8px rgba(0,0,0,.38));transition:transform .25s ease,filter .25s ease;}
  .lamp-btn:not(:disabled):hover .lamp-art{transform:translateY(-4px) scale(1.06) rotate(-2deg);filter:drop-shadow(0 9px 10px rgba(0,0,0,.42)) drop-shadow(0 0 9px rgba(255,212,83,.35));}
  .lamp-btn.picked{cursor:default;}
  .lamp-btn.picked .lamp-art{animation:lampPop .6s ease;}
  .lamp-btn.dim{opacity:.32;cursor:default;}
  .lamp-btn.dim .lamp-art{transform:none;}
  .lamp-num{
    position:absolute; top:-2px; left:50%; transform:translateX(-50%);
    background:var(--sand-1); color:var(--ink); width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-family:var(--font-display);
    font-size:14px;border:2px solid var(--night-1);z-index:2;
  }
  .lamp-glow{
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-radius:50%;
    background:radial-gradient(circle,rgba(244,196,48,.85),transparent 70%);opacity:0;pointer-events:none;
  }
  .lamp-btn.picked .lamp-glow{width:140px;height:140px;top:-44px;opacity:1;transition:all .5s ease;}
  @keyframes lampPop{0%{transform:scale(.7) rotate(0);}50%{transform:scale(1.3) rotate(10deg);}100%{transform:scale(1) rotate(0);}}
  .lamp-value{font-family:var(--font-display);font-size:28px;color:var(--treasure);min-height:34px;text-align:center;}
  .worksheet-note{
    text-align:center;background:rgba(244,196,48,.12);border:1px dashed var(--treasure);border-radius:var(--r-md);
    padding:12px 16px;font-size:15.5px;margin-top:16px;
  }

  /* ending */
  #stage.ending .bigEmoji{font-size:68px;}
  .ending-msg{text-align:center;font-size:17.5px;line-height:1.65;margin-bottom:6px;}

  .navbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;}
  .navbar .navcount{font-size:13.5px;color:#B9AEDE;}
  .nav-btn{
    font-family:var(--font-body);font-size:15.5px;border:none;border-radius:999px;padding:11px 20px;cursor:pointer;font-weight:700;
    background:rgba(255,255,255,.1);color:var(--cream);
  }
  .nav-btn:hover:not(:disabled){background:rgba(255,255,255,.2);}
  .nav-btn:disabled{opacity:.3;cursor:default;}

  @media (max-width:520px){
    .lamp-btn{width:88px;}
    .lamp-art{width:72px;height:58px;}
    #stage .story{font-size:16.5px;}
    .choice-item{font-size:16px;padding:11px 14px;}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>✨ 알라딘과 12개의 사막 관문</h1>
    <button class="pill-btn" onclick="confirmReset()">처음부터 다시</button>
  </header>

  <div id="progress"></div>

  <div id="stageWrap"><div id="stage"></div></div>
</div>

<script>
const GATES = [
  {
    emoji:'🐫', image:'images/stage01_camel.jpeg', title:'낙타 상인의 문',
    story:'사막을 걷던 알라딘 앞에 낙타 상인이 카드 네 장을 펼쳐 보였다. "이 중에서 첫소리가 다른 하나를 찾아야 지나갈 수 있어!"',
    task:'학습지 ①번 · 첫소리가 다른 하나 고르기',
    choices:['hello','hi','happy','jump'], correctIndex:3,
    answer:'hello, hi, happy는 /h/ 소리로 시작하지만 jump는 /dʒ/ 소리로 시작해요.'
  },
  {
    emoji:'🌪️', image:'images/stage02_sandstorm.jpeg', title:'모래폭풍 미로',
    story:'모래바람이 몰아치는 미로 한가운데, 요정이 그림 카드를 들고 물었다. "이 그림처럼 나무를 오르는 동작, 영어로 뭐라고 할까?"',
    task:'학습지 ②번 · 알맞은 동작 단어 고르기',
    choices:['swim','climb','catch','dance'], correctIndex:1,
    answer:'climb은 "오르다, 기어오르다"라는 뜻이에요.'
  },
  {
    emoji:'🧜', image:'images/stage03_mermaid.jpeg', title:'오아시스의 인어',
    story:'오아시스에 사는 인어가 알라딘에게 물었다. "Can you swim?" 알라딘은 아직 수영을 못한다고 솔직히 답해야 한다.',
    task:'학습지 ③번 · 알맞은 대답 고르기',
    choices:['Yes, I can.','Yes, I can\'t.','No, I can\'t.','No, I can.'], correctIndex:2,
    answer:'수영을 못한다고 할 때는 No, I can\'t. 라고 말해요.'
  },
  {
    emoji:'🪄', image:'images/stage04_carpet.jpeg', title:'요술 양탄자 요정',
    story:'양탄자 요정이 낡은 두루마리를 펼쳤다. "오르다"라는 뜻의 단어, 철자가 정확한 것을 골라야 양탄자가 날아올라!',
    task:'학습지 ④번 · 올바른 철자 고르기',
    choices:['clim','climb','clyme','clymb'], correctIndex:1,
    answer:'climb의 철자를 정확히 기억해 두세요!'
  },
  {
    emoji:'🗝️', image:'images/stage05_thieves.jpeg', title:'도둑들의 소굴',
    story:'도둑들의 소굴 문에 단어 카드가 뒤죽박죽 걸려 있다. "you / Can / dance?" 순서를 맞춰야 문이 열린다.',
    task:'학습지 ⑤번 · 올바른 문장 순서 고르기',
    choices:['You dance can?','Can dance you?','Can you dance?','Dance can you?'], correctIndex:2,
    answer:'질문을 만들 때는 Can you + 동작? 순서예요.'
  },
  {
    emoji:'🦊', image:'images/stage06_fox.jpeg', title:'사막 여우굴',
    story:'꾀 많은 사막 여우가 물었다. "Can you fly?" 알라딘은 하늘을 날 수 있다고 자신 있게 답하고 싶다.',
    task:'학습지 ⑥번 · 알맞은 대답 고르기',
    choices:['No, I can.','No, I can\'t.','Yes, I can\'t.','Yes, I can.'], correctIndex:3,
    answer:'할 수 있다고 답할 때는 Yes, I can. 이라고 말해요.'
  },
  {
    emoji:'🔮', image:'images/stage07_fortune.jpeg', title:'별자리 점술사',
    story:'밤하늘 아래 점술사가 그림 하나를 보여주었다. 그림 속 친구는 나무를 열심히 오르고 있다. 어떤 질문이 어울릴까?',
    task:'학습지 ⑦번 · 그림에 어울리는 질문 고르기',
    choices:['Can you swim?','Can you climb?','Can you dance?','Can you fly?'], correctIndex:1,
    answer:'나무를 오르고 있으니 climb을 사용해요.'
  },
  {
    emoji:'🪔', image:'images/stage08_lampmerchant.jpeg', title:'지친 알라딘, 램프 상인',
    story:'지친 알라딘에게 램프 상인이 다가왔다. 힘들어하는 친구를 격려하고 싶을 때 하는 말은 무엇일까?',
    task:'학습지 ⑧번 · 알맞은 격려 표현 고르기',
    choices:['I can\'t do it.','You can\'t do it.','You can do it!','Can you do it?'], correctIndex:2,
    answer:'힘들어하는 친구를 격려할 때는 You can do it! 이라고 말해요.'
  },
  {
    emoji:'🌠', image:'images/stage09_skygate.jpeg', title:'하늘을 나는 관문',
    story:'양탄자를 타고 하늘 위 관문에 다다르니, 눈 덮인 언덕을 쌩 미끄러져 내려오는 그림이 보인다. 이 동작을 영어로 뭐라고 할까?',
    task:'학습지 ⑨번 · 알맞은 동작 단어 고르기',
    choices:['slide','ski','run','kick'], correctIndex:1,
    answer:'눈 위를 지치며 타는 동작은 ski예요.'
  },
  {
    emoji:'🌍', image:'images/stage10_festival.jpeg', title:'세계 축제 마을',
    story:'사막을 지나 도착한 세계 축제 마을. 인도네시아 사람들이 즐겨 하는 대표 운동은 무엇일까?',
    task:'학습지 ⑩번 · 나라별 대표 운동 고르기',
    choices:['태권도','배드민턴','씨름','축구'], correctIndex:1,
    answer:'인도네시아에서는 배드민턴이 특히 인기 있어요.'
  },
  {
    emoji:'🧞', image:'images/stage11_genie.jpeg', title:'지니의 수수께끼',
    story:'드디어 만난 지니가 알라딘 이야기 속 장면들을 뒤섞어 보여주었다. 이야기에서 가장 먼저 일어난 일은 무엇일까?',
    task:'학습지 ⑪번 · 이야기 속 첫 장면 고르기',
    choices:['지니를 만났다','카잔 아저씨를 만났다','물웅덩이에 빠질 뻔했다','동굴 밖으로 나왔다'], correctIndex:1,
    answer:'이야기는 카잔 아저씨를 만나는 장면에서 시작돼요.'
  },
  {
    emoji:'🏆', image:'images/stage12_treasure.jpeg', title:'보물동굴의 마지막 문',
    story:'마지막 문 앞, 지니가 마지막 문제를 냈다. 다음 중 이번 사막 여행에서 배우지 않은 문장은 무엇일까?',
    task:'학습지 ⑫번 · 배우지 않은 문장 고르기',
    choices:['Can you jump?','Yes, I can.','You can do it!','I like apples.'], correctIndex:3,
    answer:'나머지 셋은 모두 이번 단원에서 배운 표현이에요!'
  }
];

const POOL = [10,20,20,30,30,40,50,60,0];
const TOTAL_SLIDES = 2 + GATES.length*2 + 1; // introA, introB, (question+lamp)*12, ending

let state = null;

let audioCtx = null;
function playClick(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(1450, t);
    osc.frequency.exponentialRampToValueAtTime(650, t + 0.035);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.055, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.05);
  }catch(e){}
}


function defaultState(){
  return {
    slideIndex: 0,
    revealed: new Array(GATES.length).fill(false),
    gateResults: GATES.map(()=> [null,null,null]) // 각 관문: [램프1값, 램프2값, 램프3값] (미개봉 null)
  };
}
function load(){
  try{
    const raw = localStorage.getItem('aladdin-escape-v4');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed.slideIndex==='number' && Array.isArray(parsed.revealed) && Array.isArray(parsed.gateResults)){
        state = parsed; return;
      }
    }
  }catch(e){}
  state = defaultState();
}
function save(){ try{ localStorage.setItem('aladdin-escape-v4', JSON.stringify(state)); }catch(e){} }

function slideInfo(idx){
  if(idx===0) return {type:'introA'};
  if(idx===1) return {type:'introB'};
  const last = TOTAL_SLIDES-1;
  if(idx===last) return {type:'ending'};
  const offset = idx-2;
  const gateIndex = Math.floor(offset/2);
  const sub = offset%2===0 ? 'question' : 'lamp';
  return {type:'gate-'+sub, gateIndex};
}

function renderProgress(){
  const cur = slideInfo(state.slideIndex);
  const el = document.getElementById('progress');
  el.innerHTML = GATES.map((g,i)=>{
    let cls = '';
    const done = state.gateResults[i].every(v=>v!==null);
    if(done) cls='done';
    else if(cur.gateIndex===i) cls='active';
    return `<div class="prog-dot ${cls}" title="${i+1}. ${g.title}">${done ? '✓' : (i+1)}</div>`;
  }).join('');
}

function renderStage(){
  const info = slideInfo(state.slideIndex);
  const stage = document.getElementById('stage');
  stage.classList.remove('ending');
  stage.style.animation = 'none'; void stage.offsetWidth; stage.style.animation = '';

  if(info.type==='introA'){
    stage.innerHTML = `
      <div class="bigEmoji">🌙🐫🏺</div>
      <h2>알라딘과 12개의 사막 관문</h2>
      <div class="story center">
        옛날 옛적, 사막 저편 어딘가에 요술 램프가 잠들어 있었어요.<br>
        알라딘은 보물지도를 들고 램프를 찾아 길을 떠났지만,<br>
        그 앞을 <strong>12개의 신비한 관문</strong>이 가로막고 있었죠.<br><br>
        우리 반 친구들이 문제를 풀어 알라딘을 도와줄 수 있을까요?
      </div>
      ${navRow(true,'다음 ▶')}
    `;
  } else if(info.type==='introB'){
    stage.innerHTML = `
      <div class="bigEmoji">📜</div>
      <h2>모험을 떠나기 전에</h2>
      <ol class="intro-list">
        <li>① 학습지에 있는 문제를 함께 풀어요.</li>
        <li>② 화면에서 정답을 확인해요.</li>
        <li>③ 가장 먼저 정답을 맞힌 친구가 <strong>램프 3개 중 하나</strong>를 골라요.</li>
        <li>④ 램프에서 나온 점수(또는 아이템)를 <strong>학습지에 적어요.</strong></li>
        <li>⑤ 12개의 관문을 모두 통과하면 사막 모험 완성!</li>
      </ol>
      ${navRow(true,'모험 시작하기 🏜️')}
    `;
  } else if(info.type==='gate-question'){
    const i = info.gateIndex; const g = GATES[i];
    const rev = state.revealed[i];
    const choiceHtml = g.choices.map((c,idx)=>{
      let cls='choice-item';
      if(rev){ cls += idx===g.correctIndex ? ' correct' : ' faded'; }
      return `<div class="${cls}"><span class="num">${idx+1}</span><span>${c}</span></div>`;
    }).join('');
    stage.innerHTML = `
      <div class="stage-image-box">
        <img class="stage-image" src="${g.image}" alt="${g.title}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
        <div class="stage-image-fallback">이미지를 찾을 수 없어요.<br><strong>${g.image}</strong></div>
      </div>
      <h2>${i+1}. ${g.title}</h2>
      <div class="story">${g.story}</div>
      <div class="center"><span class="tag-pill">${g.task}</span></div>
      <div class="choice-list">${choiceHtml}</div>
      ${rev ? `<div class="answer-box">${g.answer}</div>` : `
        <div class="stage-btn-row"><button class="btn btn-primary" onclick="revealAnswer(${i})">정답 확인하기</button></div>
      `}
      ${navRow(rev, '램프 뽑으러 가기 →')}
    `;
  } else if(info.type==='gate-lamp'){
    const i = info.gateIndex; const g = GATES[i];
    const result = state.gateResults[i];
    const allOpen = result.every(v=>v!==null);
    stage.innerHTML = `
      <div class="bigEmoji">${g.emoji}</div>
      <h2>${i+1}. ${g.title} · 램프 뽑기</h2>
      <p class="lamp-instruction">문제를 맞힌 친구는 학습지에 <strong>1, 2, 3</strong> 중 원하는 램프 번호를 먼저 적으세요!<br>그다음 램프를 하나씩 눌러 모두 열어보세요.</p>
      <div class="lamp-row" id="lampRow">
        ${[0,1,2].map(lane=>lampHtml(i, lane, result[lane])).join('')}
      </div>
      ${allOpen ? `<div class="worksheet-note">✏️ 내가 적어둔 번호의 점수를 학습지에 옮겨 적으세요!</div>` : ''}
      ${navRow(allOpen, '다음 관문으로 →')}
    `;
  } else if(info.type==='ending'){
    stage.classList.add('ending');
    stage.innerHTML = `
      <div class="bigEmoji">🧞</div>
      <h2>Yes, we can!</h2>
      <div class="ending-msg">
        12개의 사막 관문을 모두 통과했어요!<br>
        지니가 보물동굴 문을 활짝 열어주었습니다.<br><br>
        학습지에 적은 점수를 모두 더해 확인해 보세요 ✨
      </div>
      <div class="stage-btn-row"><button class="btn btn-primary" onclick="confirmReset()">🔄 처음부터 다시</button></div>
    `;
  }
  renderProgress();
}

function lampSvg(opened){
  return `
    <svg class="lamp-art" viewBox="0 0 160 120" role="img" aria-label="마법 램프" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gold-${opened ? 'o' : 'c'}" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#FFF1A6"/>
          <stop offset="38%" stop-color="#F8C83E"/>
          <stop offset="72%" stop-color="#D99816"/>
          <stop offset="100%" stop-color="#8E5510"/>
        </linearGradient>
        <radialGradient id="gem-${opened ? 'o' : 'c'}">
          <stop offset="0%" stop-color="#F7E9FF"/>
          <stop offset="35%" stop-color="#BA8BFF"/>
          <stop offset="100%" stop-color="#6840A8"/>
        </radialGradient>
      </defs>
      <path d="M48 53 C59 35, 100 31, 118 49 C125 57, 124 69, 115 76 C98 89, 63 90, 48 75 C41 69, 41 60, 48 53Z" fill="url(#gold-${opened ? 'o' : 'c'})" stroke="#6E4312" stroke-width="3"/>
      <path d="M111 51 C127 44, 143 46, 150 53 C137 55, 130 61, 119 66" fill="url(#gold-${opened ? 'o' : 'c'})" stroke="#6E4312" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 58 C38 54, 27 58, 24 69 C22 80, 31 89, 45 88" fill="none" stroke="#F0B72C" stroke-width="8" stroke-linecap="round"/>
      <path d="M53 81 C45 92, 42 99, 51 102 L106 102 C116 99, 113 92, 108 82" fill="url(#gold-${opened ? 'o' : 'c'})" stroke="#6E4312" stroke-width="3"/>
      <path d="M68 42 C67 32, 75 24, 85 25 C96 25, 103 33, 101 43" fill="url(#gold-${opened ? 'o' : 'c'})" stroke="#6E4312" stroke-width="3"/>
      <ellipse cx="84" cy="58" rx="10" ry="8" fill="url(#gem-${opened ? 'o' : 'c'})" stroke="#5D357E" stroke-width="2"/>
      <path d="M61 69 C75 77, 98 76, 111 66" fill="none" stroke="#FFF0A0" stroke-width="3" stroke-linecap="round" opacity=".7"/>
      ${opened ? '<path d="M124 30 C131 18, 145 20, 142 7 C154 20, 146 35, 132 37Z" fill="#B98CFF" opacity=".85"/><circle cx="145" cy="25" r="5" fill="#FFF3A6"/>' : ''}
    </svg>`;
}

function lampHtml(gateIndex, lane, value){
  const opened = value!==null;
  const cls = 'lamp-btn' + (opened ? ' picked' : '');
  const onclick = opened ? '' : `onclick="openLamp(${gateIndex}, ${lane})"`;
  return `
    <button class="${cls}" ${onclick} ${opened?'disabled':''}>
      <span class="lamp-num">${lane+1}</span>
      <div class="lamp-glow"></div>
      ${lampSvg(opened)}
      <span class="lamp-value">${opened ? valueLabel(value) : ''}</span>
    </button>
  `;
}

function valueLabel(v){
  if(v===60) return '🌟 +60';
  if(v===0) return '💨 +0';
  return '+'+v;
}

function navRow(nextEnabled, nextLabel){
  const prevDisabled = state.slideIndex===0 ? 'disabled' : '';
  return `
    <div class="navbar">
      <button class="nav-btn" ${prevDisabled} onclick="goPrev()">◀ 이전</button>
      <span class="navcount">${state.slideIndex+1} / ${TOTAL_SLIDES}</span>
      <button class="nav-btn" ${nextEnabled?'':'disabled'} onclick="goNext()">${nextLabel}</button>
    </div>
  `;
}

function revealAnswer(i){
  state.revealed[i] = true;
  save();
  renderStage();
}

function openLamp(gateIndex, lane){
  const arr = state.gateResults[gateIndex];
  if(arr[lane] !== null) return;
  const value = POOL[Math.floor(Math.random()*POOL.length)];
  arr[lane] = value;
  save();
  renderStage();
}

function goNext(){
  const info = slideInfo(state.slideIndex);
  if(info.type==='gate-question' && !state.revealed[info.gateIndex]) return;
  if(info.type==='gate-lamp' && !state.gateResults[info.gateIndex]) return;
  if(state.slideIndex >= TOTAL_SLIDES-1) return;
  state.slideIndex++;
  save();
  renderStage();
}
function goPrev(){
  if(state.slideIndex<=0) return;
  state.slideIndex--;
  save();
  renderStage();
}

function confirmReset(){
  if(!confirm('처음부터 다시 시작할까요? 진행 상황이 모두 초기화됩니다. (학습지에 적은 점수는 그대로 남아있어요!)')) return;
  state = defaultState();
  save();
  renderStage();
}

document.addEventListener('pointerdown', (e)=>{
  const btn = e.target.closest('button');
  if(btn && !btn.disabled) playClick();
});

document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight') goNext();
  if(e.key==='ArrowLeft') goPrev();
});

function renderBg(){
  for(let n=0;n<24;n++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100+'%';
    s.style.top = (Math.random()*40)+'%';
    const size = 1+Math.random()*2;
    s.style.width = s.style.height = size+'px';
    document.body.appendChild(s);
  }
  const moon = document.createElement('div');
  moon.className='moon';
  document.body.appendChild(moon);
}

load();
renderBg();
renderStage();
</script>
</body>
</html>
